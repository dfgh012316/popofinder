name: CI pipeline

on:
  pull_request:
    types:
      - closed
    branches:
      - develop
    # Only changes that can change the image (or how it is built and deployed) run the
    # pipeline; docs, README, assets and scripts do not. Tests and test fixtures are not
    # in the image either. workflow_dispatch still builds anything on demand.
    paths:
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "go.mod"
      - "go.sum"
      - "dockerfile"
      - ".dockerignore"
      - "makefile"
      - ".github/workflows/ci.yaml"
      - "!**/*_test.go"
      - "!**/testdata/**"
  workflow_dispatch:

# Runs queue instead of overlapping. Each run builds and deploys its own merge commit,
# so of two runs started close together the one that finishes last wins: on 2026-11-01
# the run for #53 finished after the one for #54 and put production back on 1bfa607,
# without #54. A newer pending run replaces an older pending one, which is fine: its
# merge commit includes the older one. Closing a PR without merging also starts a run
# (it builds nothing); it gets a group of its own so it never replaces a pending
# deployment run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && !github.event.pull_request.merged && format('unmerged-{0}', github.run_id) || github.workflow }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.vars.outputs.DOCKER_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set build variables
        id: vars
        run: |
          echo "DOCKER_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TAG: ${{ steps.vars.outputs.DOCKER_TAG }}
        run: make ci

      - name: Build Summary
        run: |
          echo "### Build Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ secrets.DOCKER_USERNAME }}/popofinder:${{ steps.vars.outputs.DOCKER_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- Latest Tag: ${{ secrets.DOCKER_USERNAME }}/popofinder:latest" >> $GITHUB_STEP_SUMMARY

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: dfgh012316
          repositories: jerrytech-deploy
      - name: Dispatch deploy to jerrytech-deploy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.build-and-push.outputs.docker_tag }}
        run: |
          jq -nc --arg tag "$TAG" \
            '{event_type:"deploy-app",client_payload:{app:"popofinder",tag:$tag}}' \
            | gh api -X POST /repos/dfgh012316/jerrytech-deploy/dispatches --input -
