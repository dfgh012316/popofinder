{{define "layout"}}<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{if .NoIndex}}<meta name="robots" content="noindex, nofollow">
{{end}}<title>{{.HeadTitle}}</title>
<meta name="description" content="{{.Description}}">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
{{with .Canonical}}<link rel="canonical" href="{{.}}">
<meta property="og:url" content="{{.}}">
{{end}}<meta property="og:type" content="website">
<meta property="og:locale" content="zh_TW">
<meta property="og:site_name" content="POPO Finder">
<meta property="og:title" content="{{.HeadTitle}}">
<meta property="og:description" content="{{.Description}}">
<meta property="og:image" content="{{.OGImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="POPO Finder：查醫師在哪裡受醫學教育，附來源連結可核對">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{.HeadTitle}}">
<meta name="twitter:description" content="{{.Description}}">
<meta name="twitter:image" content="{{.OGImage}}">
{{with .JSONLD}}<script type="application/ld+json">{{.}}</script>
{{end}}
<style>
/* A lookup tool first: one search box, and doctor cards that put the 學歷 in a
   tinted block, the same layout as the LINE card. One blue for actions and links;
   the yellow marker only for focus and "you are here". */
:root{
  --paper:#f5f7fa;--surface:#fff;--ink:#1b2436;--ink-2:#3b4458;--muted:#646c7e;
  --rule:#e2e6ed;--blue:#1f4bb8;--blue-tint:#eef3fd;--marker:#ffe066;
  --bar-official:#256abf;--bar-other:#86b6ef;
  --shadow:0 1px 2px rgba(27,36,54,.06),0 10px 28px rgba(27,36,54,.07);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#10151d;--surface:#171d28;--ink:#e8ecf3;--ink-2:#c3cad6;--muted:#9aa3b4;
  --rule:#2a3343;--blue:#a8c0ff;--blue-tint:#1c2840;--marker:#d8b73a;
  --bar-official:#86b6ef;--bar-other:#3a5a9e;--shadow:none;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:16px/1.7 var(--sans);font-variant-numeric:tabular-nums}
a{color:var(--blue);text-underline-offset:.18em}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--marker);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-weight:800;line-height:1.35;margin:0}
p{margin:0 0 12px}
.wrap{max-width:68rem;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-999px}
.skip:focus{left:16px;top:8px;background:var(--surface);padding:6px 10px;z-index:2}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* Header */
.top{background:var(--surface);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:baseline;gap:8px;color:var(--ink);text-decoration:none;margin-right:auto}
.brand b{font-size:19px;font-weight:800;letter-spacing:.01em}
.brand span{font-size:13px;color:var(--muted)}
.top nav{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:14px}
.top nav a{color:var(--ink-2);text-decoration:none;padding:4px 0}
.top nav a[aria-current]{box-shadow:inset 0 -3px 0 var(--marker);color:var(--ink)}
.top form{flex:1 1 100%;display:flex;gap:8px}
@media (min-width:860px){.top form{flex:0 1 28rem}.brand{margin-right:0}.top nav{margin-left:auto}}
/* On a phone a search page keeps the box and the results; the links are in the footer. */
@media (max-width:639px){.top.has-search nav{display:none}}

/* Search controls */
input,button{font:inherit;color:inherit}
.field{flex:1;min-width:0;height:44px;padding:0 12px;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
.field::placeholder{color:var(--muted)}
.go{height:44px;padding:0 20px;border:0;border-radius:10px;background:var(--blue);color:var(--surface);font-weight:700;cursor:pointer;white-space:nowrap}

main{flex:1;padding:24px 0 48px}
.col{max-width:46rem}

/* Home: the search box is the page. */
.home{max-width:40rem;margin:0 auto;padding-top:clamp(16px,9vh,96px);text-align:center}
.home h1{font-size:clamp(28px,6.4vw,42px);letter-spacing:.01em}
.home .lead{color:var(--ink-2);font-size:17px;margin:10px 0 0}
.lookup{display:flex;gap:6px;margin:24px 0 16px;padding:6px;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow)}
.lookup:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-tint),var(--shadow)}
.lookup .field{border:0;height:52px;font-size:18px;background:transparent}
.lookup .field:focus-visible{outline:none}
.lookup .go{height:52px;font-size:17px;border-radius:12px;padding:0 22px}
.try{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;font-size:15px}
.chip{flex:none;display:inline-flex;align-items:baseline;gap:6px;padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--rule);color:var(--ink);text-decoration:none;font-size:15px;line-height:1.5}
.chip:hover{border-color:var(--blue)}
.chip .num{color:var(--muted);font-size:13px}
.chip small{color:var(--muted);font-size:12px}
.stat{margin:40px 0 6px;color:var(--ink-2);font-size:15px}
.fine{color:var(--muted);font-size:13px;max-width:34rem;margin:0 auto}

/* Results */
.rhead h1{font-size:clamp(22px,4.6vw,28px);overflow-wrap:anywhere}
.rmeta{color:var(--ink-2);margin:4px 0 0}
.note{font-size:13px;color:var(--muted);margin:2px 0 0}
.narrow{display:grid;gap:8px;margin:16px 0 0}
.facet{display:flex;align-items:center;gap:10px;min-width:0}
.facet>span{flex:none;font-size:13px;color:var(--muted)}
.facet .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
@media (min-width:860px){.facet .chips{flex-wrap:wrap;overflow:visible}}
.cards{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr))}
.card{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px 18px 8px}
.card h2{font-size:21px;letter-spacing:.03em;overflow-wrap:anywhere}
.card .hosp{font-weight:700;color:var(--ink-2);margin:2px 0 0;overflow-wrap:anywhere}
.card .where{display:flex;flex-wrap:wrap;gap:0 12px;color:var(--muted);font-size:14px;margin:0}
.edu{margin-top:14px;background:var(--blue-tint);border-radius:10px;padding:10px 14px}
.edu h3{font-size:12px;font-weight:500;color:var(--muted)}
.edu ul{list-style:none;margin:0;padding:0}
.edu li{font-weight:700;line-height:1.55;overflow-wrap:anywhere}
.edu li+li{margin-top:4px}
.detail{margin-top:12px;font-size:15px;color:var(--ink-2)}
.detail h3{font-size:12px;font-weight:500;color:var(--muted)}
.detail ul{list-style:none;margin:0;padding:0}
.detail li{line-height:1.6;overflow-wrap:anywhere}
.detail li+li{margin-top:2px}
.detail summary{cursor:pointer;color:var(--blue);font-size:14px;font-weight:700;margin-top:4px;width:max-content}
.detail details ul{margin-top:2px}
.card .src{margin:auto 0 0;padding-top:12px;font-size:13px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:2px 4px;margin:8px -10px 0;padding-top:4px;border-top:1px solid var(--rule)}
.acts a{display:inline-flex;align-items:center;min-height:40px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:700;text-decoration:none}
.acts a:hover{background:var(--blue-tint)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px}
.pager a{display:inline-flex;align-items:center;height:42px;padding:0 16px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);font-weight:700;text-decoration:none}
.empty{margin-top:16px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px 20px}
.empty h2{font-size:19px;margin-bottom:8px}
.empty ul{margin:0;padding-left:1.2em;color:var(--ink-2)}
.empty li+li{margin-top:4px}
.capped{color:var(--muted);font-size:14px;margin:16px 0 0}

/* About */
.prose h1{margin-bottom:12px}
.prose h2{font-size:20px;margin:32px 0 10px}
.prose>p{color:var(--ink-2)}
.points{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.points b{display:block}
.points span{color:var(--ink-2);font-size:15px}
.faq details{border-bottom:1px solid var(--rule)}
.faq summary{cursor:pointer;padding:12px 0;font-weight:700}
.faq details p{color:var(--ink-2);margin:0 0 14px}

/* Coverage page: the bar splits official directories from other sources. */
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--muted);margin:4px 0 14px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:4px;margin-right:6px;vertical-align:middle}
.k-official{background:var(--bar-official)}
.k-other{background:var(--bar-other)}
.bar{display:flex;gap:2px;height:8px}
.bar span{display:block;height:8px;border-radius:4px;min-width:3px}
.bar .o{background:var(--bar-official)}
.bar .x{background:var(--bar-other)}
.city-block{padding:14px 0;border-bottom:1px solid var(--rule)}
.city-block h3{font-size:18px;display:flex;align-items:baseline;gap:12px}
.city-block h3 .num{font-size:14px;font-weight:400;color:var(--muted)}
.city-block .bar{margin:8px 0;max-width:30rem}
.hosp-list{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px 24px;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr))}
.hosp-list li{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.hosp-list .num{color:var(--muted);font-size:14px}
.thumbs{display:flex;gap:6px;margin:6px 0 4px;flex-wrap:wrap}
.thumbs a{padding:4px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--rule);color:var(--ink);text-decoration:none;font-weight:700}
.region-block{scroll-margin-top:12px;padding-top:20px}
.region-block>h2{font-size:22px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.region-block:target>h2{box-shadow:inset 0 -6px 0 var(--marker)}
.lede{margin-top:10px}
.small{font-size:14px;margin:4px 0 0}
.end-note{margin-top:24px}

/* Report */
.report h1{margin-bottom:16px}
.report>p{white-space:pre-line;color:var(--ink-2)}
.report .small{margin-top:12px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.actions a{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:10px;background:var(--blue);color:var(--surface);font-weight:700;text-decoration:none}
.actions a.quiet{background:var(--blue-tint);color:var(--ink)}
.message{padding:24px 0;font-size:18px}

footer{border-top:1px solid var(--rule);background:var(--surface);color:var(--muted);font-size:14px;padding:20px 0 32px}
footer nav{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:8px}
footer a{color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#main">跳到主要內容</a>
<header class="top{{if .HeaderSearch}} has-search{{end}}"><div class="wrap">
<a class="brand" href="/"><b>POPO Finder</b><span>醫師學歷查詢</span></a>
{{if .HeaderSearch}}<form action="/search" method="get" role="search">
<input class="field" name="q" value="{{.Query}}" placeholder="醫師姓名、醫院或科別" aria-label="查詢醫師" maxlength="300" required>
<button class="go" type="submit">查詢</button>
</form>
{{end}}<nav aria-label="網站">
<a href="/hospitals"{{if eq .Nav "hospitals"}} aria-current="page"{{end}}>收錄範圍</a>
<a href="/about"{{if eq .Nav "about"}} aria-current="page"{{end}}>關於</a>
<a href="/report"{{if eq .Nav "report"}} aria-current="page"{{end}}>補充與更正</a>
<a href="{{.LineURL}}" rel="noopener">LINE 版</a>
</nav>
</div></header>
<main id="main"><div class="wrap">
{{template "content" .Content}}
</div></main>
<footer><div class="wrap">
<nav aria-label="頁尾"><a href="/">查詢</a><a href="/hospitals">收錄範圍</a><a href="/about">關於與常見問題</a><a href="/report">補充、更正與下架</a><a href="{{.LineURL}}" rel="noopener">加入 LINE 版</a><a href="{{.RepoURL}}" rel="noopener">程式碼</a></nav>
<div>只呈現公開的學歷事實，不評價任何醫師。</div>
</div></footer>
</body>
</html>{{end}}
