{{define "content"}}
<section class="home">
<h1>查醫師在哪裡受醫學教育</h1>
<p class="lead">輸入醫師姓名，也可以加上醫院或科別。</p>
<form class="lookup" action="/search" method="get" role="search">
<input class="field" name="q" placeholder="醫師姓名、醫院或科別" aria-label="醫師姓名、醫院或科別" maxlength="300" required>
<button class="go" type="submit">查詢</button>
</form>
<div class="try"><span class="muted">試試</span>
{{range .Examples}}<a class="chip" href="/search?q={{.Query}}" title="{{.Note}}">{{.Query}}</a>
{{end}}</div>
{{with .Stats}}<p class="stat">已收錄 <b class="num">{{comma .Total}}</b> 位醫師，其中 <b class="num">{{comma .Official}}</b> 位來自 {{.Hospitals}} 家醫院官網的完整名單。<a href="/hospitals">看收錄範圍</a></p>{{end}}
<p class="fine">{{.Coverage}}</p>
</section>
{{end}}
