<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 2500px; height: 843px; overflow: hidden; background: #ffffff; }
  body {
    display: grid;
    grid-template-columns: 833px 834px 833px;
    font-family: "Noto Sans CJK TC", "Noto Sans TC", sans-serif;
    border-top: 6px solid #1DB446;
    box-sizing: border-box;
  }
  .tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }
  .tile + .tile::before {
    content: ""; position: absolute; left: 0; top: 150px; bottom: 150px;
    width: 3px; background: #e6e6e6;
  }
  .icon {
    width: 260px; height: 260px; border-radius: 50%;
    background: #e8f7ec;
    display: flex; align-items: center; justify-content: center;
  }
  .icon svg {
    width: 150px; height: 150px;
    fill: none; stroke: #1DB446; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  }
  .label { margin-top: 44px; font-size: 108px; font-weight: 700; color: #222222; line-height: 1.15; }
  .sub { margin-top: 14px; font-size: 64px; color: #777777; line-height: 1.2; }
</style>
</head>
<body>
  <div class="tile">
    <div class="icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
